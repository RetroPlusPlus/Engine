name: AMD D3D12 (BeefWin, on demand)

# Real-AMD verification on the BeefWin runner ONLY. AMD's D3D12 driver is the one backend that exhibits
# the StructureByteStride-0 StructuredBuffer collapse (only the first sprite instance renders); every
# other backend (NVIDIA, WARP, Metal, Vulkan) hides it, so the standard matrix (Windows job on WARP)
# cannot confirm the ByteAddressBuffer fix. This job is that confirmation gate.
#
# Manual dispatch ONLY. BeefWin is intermittent and NOT in the standard matrix. The job SELF-PROVISIONS
# its build toolchain (fresh Windows box) and builds/tests entirely inside $RUNNER_TEMP — never C:\ root.

on:
  workflow_dispatch:

jobs:
  build-amd-d3d12:
    name: AMD D3D12 (BeefWin, x64)
    runs-on: [self-hosted, Windows, X64, BeefWin]
    # A bare Windows box ships execution policy = Restricted, which blocks the script GitHub writes for a
    # plain `shell: powershell` step (PSSecurityException). Launch every PowerShell step with
    # -ExecutionPolicy Bypass (process scope — always effective, no persistent change needed). The trailing
    # `exit $LASTEXITCODE` restores the exit-code propagation GitHub's built-in shell would add.
    defaults:
      run:
        shell: "powershell -ExecutionPolicy Bypass -NoProfile -Command \"$ErrorActionPreference='Stop'; & '{0}'; exit $LASTEXITCODE\""

    steps:
      # Runs BEFORE checkout (checkout needs git). Installs only what's missing; exposes the tool dirs to
      # later steps via $GITHUB_PATH (winget updates the machine PATH, but the runner process keeps a stale
      # PATH until its service restarts, so later steps wouldn't otherwise see the new tools).
      - name: Provision build dependencies (self-setup fresh runner)
        run: |
          # No winget (invisible to an admin/service runner). Tools are installed on the box already; this
          # just exposes them to later steps via $GITHUB_PATH (the runner process may hold a stale PATH), and
          # installs from direct vendor downloads only if something is genuinely missing.
          $tmp = Join-Path $env:RUNNER_TEMP "provision"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          if (-not (Test-Path "C:\Program Files\Git\cmd\git.exe")) {
            Invoke-WebRequest "https://github.com/git-for-windows/git/releases/download/v2.47.1.windows.1/Git-2.47.1-64-bit.exe" -OutFile "$tmp\git.exe" -UseBasicParsing
            Start-Process "$tmp\git.exe" -Wait -ArgumentList "/VERYSILENT","/NORESTART","/SP-","/SUPPRESSMSGBOXES","/NOCANCEL"
          }
          if (-not (Test-Path "C:\Program Files\CMake\bin\cmake.exe")) {
            Invoke-WebRequest "https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-windows-x86_64.msi" -OutFile "$tmp\cmake.msi" -UseBasicParsing
            Start-Process msiexec.exe -Wait -ArgumentList "/i",('"' + "$tmp\cmake.msi" + '"'),"/quiet","/norestart","ADD_CMAKE_TO_PATH=System"
          }
          $vs = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\2022\BuildTools"
          if (-not (Test-Path $vs)) {
            Invoke-WebRequest "https://aka.ms/vs/17/release/vs_BuildTools.exe" -OutFile "$tmp\vs_BuildTools.exe" -UseBasicParsing
            $vsArgs = @("--quiet","--wait","--norestart","--nocache","--add","Microsoft.VisualStudio.Workload.VCTools","--add","Microsoft.VisualStudio.Component.VC.Tools.x86.x64","--add","Microsoft.VisualStudio.Component.VC.Llvm.Clang","--add","Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset","--add","Microsoft.VisualStudio.Component.Windows11SDK.22621","--includeRecommended")
            $proc = Start-Process "$tmp\vs_BuildTools.exe" -Wait -PassThru -ArgumentList $vsArgs
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) { throw ("VS Build Tools installer exited " + $proc.ExitCode) }
          }
          if (Test-Path "C:\Program Files\Git\cmd")   { Add-Content $env:GITHUB_PATH "C:\Program Files\Git\cmd" }
          if (Test-Path "C:\Program Files\CMake\bin") { Add-Content $env:GITHUB_PATH "C:\Program Files\CMake\bin" }
          $dxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter dxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1
          if ($null -ne $dxc) { Add-Content $env:GITHUB_PATH (Split-Path $dxc.FullName) } else { Write-Host "WARN: dxc.exe not located" }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify toolchain
        run: |
          cmake --version
          git --version
          $dxc = Get-Command dxc -ErrorAction SilentlyContinue
          if ($dxc) { Write-Host "dxc: $($dxc.Source)" } else { Write-Host "WARN: dxc not on PATH" }

      - name: Clean CMake cache (preserve downloads)
        run: |
          $build = "$env:RUNNER_TEMP\amd-d3d12-build"
          if (Test-Path "$build\CMakeCache.txt") { Remove-Item "$build\CMakeCache.txt" -Force }
          if (Test-Path "$build\CMakeFiles")     { Remove-Item "$build\CMakeFiles" -Recurse -Force }
          if (Test-Path "$build\_deps") {
            Get-ChildItem "$build\_deps" -Filter "*-subbuild" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Configure
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B $env:RUNNER_TEMP\amd-d3d12-build `
            -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build
        run: cmake --build $env:RUNNER_TEMP\amd-d3d12-build --config Release --parallel

      - name: Test (real AMD — SpriteInstancing is the fix proof; GoldenReadback excluded)
        run: |
          # GoldenReadback is EXCLUDED: its committed d3d12-x64 goldens are captured on the non-AMD standard
          # runner, so an AMD-vs-committed pixel comparison is expected rasterizer variance, not a regression.
          # The reference-free SpriteInstancing.EveryInstanceRendersItsOwnRecord test is the AMD proof — red on
          # the stride-0 collapse, green once ByteAddressBuffer fixes it.
          $out = "$env:RUNNER_TEMP\amd-d3d12-output"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $results = "$out\amd-d3d12-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir $env:RUNNER_TEMP\amd-d3d12-build -C Release -E GoldenReadback --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd-d3d12-test-results
          path: ${{ runner.temp }}\amd-d3d12-output\
