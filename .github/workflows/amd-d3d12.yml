name: AMD D3D12 (BeefWin, on demand)

# Real-AMD verification on the BeefWin runner ONLY. AMD's D3D12 driver is the one backend that exhibits
# the StructureByteStride-0 StructuredBuffer collapse (only the first sprite instance renders); every
# other backend (NVIDIA, WARP, Metal, Vulkan) hides it, so the standard matrix (Windows job on WARP)
# cannot confirm the ByteAddressBuffer fix. This job is that confirmation gate.
#
# Manual dispatch ONLY. BeefWin is intermittent and NOT in the standard matrix. The job SELF-PROVISIONS
# its build toolchain (fresh Windows box) and builds/tests entirely inside $RUNNER_TEMP — never C:\ root.

on:
  workflow_dispatch:

jobs:
  build-amd-d3d12:
    name: AMD D3D12 (BeefWin, x64)
    runs-on: [self-hosted, Windows, X64, BeefWin]

    steps:
      # A bare Windows box ships PowerShell execution policy = Restricted, which blocks every
      # `shell: powershell` step (the script GitHub writes refuses to run: PSSecurityException). cmd is NOT
      # subject to that policy — use it to invoke powershell with -ExecutionPolicy Bypass and set a
      # persistent RemoteSigned policy for the runner's user, so all later PowerShell steps run.
      - name: Allow local PowerShell scripts (execution policy)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned -Force"

      # Runs BEFORE checkout (checkout needs git). Installs only what's missing; exposes the tool dirs to
      # later steps via $GITHUB_PATH (winget updates the machine PATH, but the runner process keeps a stale
      # PATH until its service restarts, so later steps wouldn't otherwise see the new tools).
      - name: Provision build dependencies (self-setup fresh runner)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            throw "winget not found on the runner. Install 'App Installer' from the Microsoft Store once, then re-dispatch."
          }
          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Git ..."
            winget install --id Git.Git --exact --silent --accept-source-agreements --accept-package-agreements
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            Write-Host "Installing CMake ..."
            winget install --id Kitware.CMake --exact --silent --accept-source-agreements --accept-package-agreements
          }
          $vs = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools"
          if (-not (Test-Path $vs)) {
            Write-Host "Installing VS 2022 Build Tools (C++ + ClangCL + Windows 11 SDK) ... this takes a few minutes"
            winget install --id Microsoft.VisualStudio.2022.BuildTools --exact --silent `
              --accept-source-agreements --accept-package-agreements `
              --override "--quiet --wait --norestart --nocache --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.VC.Llvm.Clang --add Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset --add Microsoft.VisualStudio.Component.Windows11SDK.22621 --includeRecommended"
          } else {
            Write-Host "VS BuildTools present."
          }
          # Expose git + cmake to later steps (the VS generator locates the toolset itself, no PATH needed).
          if (Test-Path "C:\Program Files\Git\cmd")   { Add-Content $env:GITHUB_PATH "C:\Program Files\Git\cmd" }
          if (Test-Path "C:\Program Files\CMake\bin") { Add-Content $env:GITHUB_PATH "C:\Program Files\CMake\bin" }
          # gen_shader.cmake calls `dxc` (bare) — expose the Windows SDK's dxc.exe dir.
          $dxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter dxc.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if ($dxc) { Add-Content $env:GITHUB_PATH (Split-Path $dxc.FullName) } else { Write-Host "WARN: dxc.exe not located yet" }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify toolchain
        shell: powershell
        run: |
          cmake --version
          git --version
          $dxc = Get-Command dxc -ErrorAction SilentlyContinue
          if ($dxc) { Write-Host "dxc: $($dxc.Source)" } else { Write-Host "WARN: dxc not on PATH" }

      - name: Clean CMake cache (preserve downloads)
        shell: powershell
        run: |
          $build = "$env:RUNNER_TEMP\amd-d3d12-build"
          if (Test-Path "$build\CMakeCache.txt") { Remove-Item "$build\CMakeCache.txt" -Force }
          if (Test-Path "$build\CMakeFiles")     { Remove-Item "$build\CMakeFiles" -Recurse -Force }
          if (Test-Path "$build\_deps") {
            Get-ChildItem "$build\_deps" -Filter "*-subbuild" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B $env:RUNNER_TEMP\amd-d3d12-build `
            -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build
        shell: powershell
        run: cmake --build $env:RUNNER_TEMP\amd-d3d12-build --config Release --parallel

      - name: Test (real AMD — SpriteInstancing is the fix proof; GoldenReadback excluded)
        shell: powershell
        run: |
          # GoldenReadback is EXCLUDED: its committed d3d12-x64 goldens are captured on the non-AMD standard
          # runner, so an AMD-vs-committed pixel comparison is expected rasterizer variance, not a regression.
          # The reference-free SpriteInstancing.EveryInstanceRendersItsOwnRecord test is the AMD proof — red on
          # the stride-0 collapse, green once ByteAddressBuffer fixes it.
          $out = "$env:RUNNER_TEMP\amd-d3d12-output"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $results = "$out\amd-d3d12-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir $env:RUNNER_TEMP\amd-d3d12-build -C Release -E GoldenReadback --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd-d3d12-test-results
          path: ${{ runner.temp }}\amd-d3d12-output\
