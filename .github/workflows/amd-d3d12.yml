name: AMD D3D12 (BeefWin, on demand)

# Real-AMD verification, on the BeefWin runner ONLY. AMD's D3D12 driver is the one backend that exhibits
# the StructureByteStride-0 StructuredBuffer collapse (only the first sprite instance renders); every
# other backend — NVIDIA, WARP, Metal, Vulkan — hides it. The standard 5-job matrix runs the Windows x64
# job on WARP, so it cannot see the bug or confirm the fix. This job is the confirmation gate for the
# ByteAddressBuffer fix.
#
# Manual dispatch ONLY. BeefWin is intermittently available and is deliberately NOT part of the standard
# matrix — a standard job pinned to it would stall every push when it is offline. Dispatch this when the
# box is online.
#
# Everything is built and tested INSIDE the runner's own folder ($RUNNER_TEMP) — never C:\ root.

on:
  workflow_dispatch:

jobs:
  build-amd-d3d12:
    name: AMD D3D12 (BeefWin, x64)
    # The BeefWin label pins this to the AMD box; the generic Windows-x64 runner lacks it.
    runs-on: [self-hosted, Windows, X64, BeefWin]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean CMake cache (preserve downloads)
        shell: powershell
        run: |
          $build = "$env:RUNNER_TEMP\amd-d3d12-build"
          if (Test-Path "$build\CMakeCache.txt") { Remove-Item "$build\CMakeCache.txt" -Force }
          if (Test-Path "$build\CMakeFiles")     { Remove-Item "$build\CMakeFiles" -Recurse -Force }
          if (Test-Path "$build\_deps") {
            Get-ChildItem "$build\_deps" -Filter "*-subbuild" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B $env:RUNNER_TEMP\amd-d3d12-build `
            -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build
        shell: powershell
        run: cmake --build $env:RUNNER_TEMP\amd-d3d12-build --config Release --parallel

      - name: Test (real AMD — SpriteInstancing is the fix proof; GoldenReadback excluded)
        shell: powershell
        run: |
          # GoldenReadback is EXCLUDED: its committed d3d12-x64 goldens are captured on the standard
          # (non-AMD) Windows runner, so an AMD-vs-committed pixel comparison is expected rasterizer
          # variance, not a regression. The reference-free SpriteInstancing.EveryInstanceRendersItsOwnRecord
          # test is the AMD proof — it asserts each sprite renders its own record (red on the stride-0
          # collapse, green once ByteAddressBuffer fixes it), needing no golden.
          $out = "$env:RUNNER_TEMP\amd-d3d12-output"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $results = "$out\amd-d3d12-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir $env:RUNNER_TEMP\amd-d3d12-build -C Release -E GoldenReadback --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # PowerShell has no `set -o pipefail`; Tee-Object does not update $LASTEXITCODE, so capture the
          # cmd /c exit code after the pipeline or a ctest failure would silently report green.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd-d3d12-test-results
          path: ${{ runner.temp }}\amd-d3d12-output\
