name: Regenerate Shaders

# Dev-only shader regeneration. The engine build never compiles shaders — it consumes
# the committed byte-array headers under shaders/generated/. This workflow rebuilds
# those headers from shaders/src/*.hlsl using SDL_shadercross on a runner that has the
# toolchain (Linux x64 — beefserve), and uploads them as an artifact to download and
# commit. It does NOT commit anything itself, so the commit gate stays with a human.
#
# Triggers: manual dispatch, or a push to a ci/** branch that changes a shader source,
# the wrap/bootstrap scripts, or this workflow. It is independent of ci.yml (the build
# pipeline) — shaders changing is the only thing that should re-run generation.

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'
    paths:
      - 'shaders/src/**'
      - 'shaders/wrap_headers.py'
      - 'shaders/bootstrap_shadercross.sh'
      - '.github/workflows/regenerate-shaders.yml'

env:
  # Pinned SDL_shadercross commit (no tagged release exists). Recorded in shaders/README.md.
  SHADERCROSS_REF: 1d8b0556eefb11a77bc9c28249d16f7a3e0459e9

jobs:
  regenerate:
    name: Regenerate shaders (beefserve, x64)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout (recursive — SDL3 source for the shadercross build)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap SDL_shadercross (cached after first run)
        run: |
          shaders/bootstrap_shadercross.sh \
            "$HOME/.cache/gbcpp/shader-tools" \
            "$GITHUB_WORKSPACE/third_party/sdl" \
            "$SHADERCROSS_REF"

      - name: Compile shaders → SPIR-V / DXIL / MSL
        run: |
          set -euo pipefail
          TOOLS="$HOME/.cache/gbcpp/shader-tools"
          export LD_LIBRARY_PATH="$TOOLS/lib:${LD_LIBRARY_PATH:-}"
          SC="$TOOLS/bin/shadercross"
          OUT=/tmp/gbcpp-shaderout
          rm -rf "$OUT"; mkdir -p "$OUT"
          compile() {  # <stem> <stage>
            local stem="$1" stage="$2"
            "$SC" "shaders/src/$stem.hlsl" -t "$stage" -e main -d SPIRV -o "$OUT/$stem.spv"
            "$SC" "shaders/src/$stem.hlsl" -t "$stage" -e main -d DXIL  -o "$OUT/$stem.dxil"
            "$SC" "shaders/src/$stem.hlsl" -t "$stage" -e main -d MSL   -o "$OUT/$stem.msl"
          }
          compile blit.vert vertex
          compile blit.frag fragment
          ls -l "$OUT"

      - name: Wrap into committed headers
        run: python3 shaders/wrap_headers.py /tmp/gbcpp-shaderout shaders/generated blit.vert blit.frag

      - name: Upload generated headers
        uses: actions/upload-artifact@v4
        with:
          name: shader-headers
          path: shaders/generated/
