name: CI

# Push runs self-name from the commit message; a manual dispatch carries this authored name so it
# reads in the history as what it is, not a bare "CI".
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Capture ColorFill-gather goldens (vulkan-x64/arm64, d3d12-x64) — sequential per-region output pinned before the gather routes' || '' }}

# Triggers fire on ci/** in THIS repo only — not main, not pull_request.
# Source reaches main only via squash-merge from a ci/<branch> that already ran
# CI to green. This is the engine's own standalone pipeline (build mode 1); it is
# wholly independent of any consumer game's CI — separate repo, separate runs.
on:
  push:
    branches:
      - 'ci/**'
  workflow_dispatch:
    inputs:
      capture_goldens:
        description: 'Capture + upload the golden fixtures for each backend (instead of comparing against committed ones)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# SameBoy is vendored as a submodule and compiled into the engine (the GB/GBC core backs
# the VM host); checkout pulls it with submodules: recursive.

jobs:

  # ── Linux (beefserve, self-hosted, x64) ─────────────────────────────────────
  build-linux:
    name: Linux (beefserve, x64)
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B /tmp/retropp-engine-ci-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build /tmp/retropp-engine-ci-build --parallel

      - name: Test
        run: |
          set -o pipefail   # without this, tee's exit code masks ctest failures
          export SDL_VIDEODRIVER=offscreen   # headless: SDL video init succeeds so the GPU device (lavapipe) is reachable
          if [ "${{ github.event.inputs.capture_goldens }}" = "true" ]; then export RETROPP_CAPTURE_GOLDEN=1; fi
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir /tmp/retropp-engine-ci-build --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-test-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: ci-output/

      - name: Upload captured goldens
        if: ${{ github.event.inputs.capture_goldens == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-linux-x64
          path: tests/fixtures/golden/

  # ── macOS (ericmacmini, self-hosted, ARM64) ──────────────────────────────────
  build-macos:
    name: macOS (ericmacmini, ARM64)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B /tmp/retropp-engine-ci-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build /tmp/retropp-engine-ci-build --parallel

      - name: Test
        run: |
          set -o pipefail   # without this, tee's exit code masks ctest failures
          if [ "${{ github.event.inputs.capture_goldens }}" = "true" ]; then export RETROPP_CAPTURE_GOLDEN=1; fi
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir /tmp/retropp-engine-ci-build --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/macos-test-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-results
          path: ci-output/

      - name: Upload captured goldens
        if: ${{ github.event.inputs.capture_goldens == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-macos
          path: tests/fixtures/golden/

  # ── Windows (WINDOWS-BVDA56O, self-hosted, x64) ──────────────────────────────
  build-windows-msvc:
    name: Windows clang-cl (WINDOWS-BVDA56O, x64)
    runs-on: [self-hosted, X64, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean CMake cache (preserve downloads)
        shell: powershell
        run: |
          if (Test-Path C:\retropp-engine-ci-build\CMakeCache.txt) {
            Remove-Item C:\retropp-engine-ci-build\CMakeCache.txt -Force
          }
          if (Test-Path C:\retropp-engine-ci-build\CMakeFiles) {
            Remove-Item C:\retropp-engine-ci-build\CMakeFiles -Recurse -Force
          }
          if (Test-Path C:\retropp-engine-ci-build\_deps) {
            Get-ChildItem C:\retropp-engine-ci-build\_deps -Filter "*-subbuild" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\retropp-engine-ci-build `
            -G "Visual Studio 17 2022" -A x64 -T ClangCL

      - name: Build
        shell: powershell
        run: cmake --build C:\retropp-engine-ci-build --config Release --parallel

      - name: Test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\ci-output | Out-Null
          # A held handle on the fixed results name has locked this step before; write a run-unique file
          # (and best-effort clear deletable stale ones) so a stale handle can never block the write.
          Get-ChildItem C:\ci-output\windows-test-results*.txt -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          if ("${{ github.event.inputs.capture_goldens }}" -eq "true") { $env:RETROPP_CAPTURE_GOLDEN = "1" }
          $results = "C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir C:\retropp-engine-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # PowerShell equivalent of `set -o pipefail` — Tee-Object does not update
          # $LASTEXITCODE; the cmd /c exit code is captured after the pipeline.
          # Without this, ctest failures would silently report green.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: C:\ci-output\windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt

      - name: Upload captured goldens
        if: ${{ github.event.inputs.capture_goldens == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-windows-x64
          path: tests/fixtures/golden/

  # ── Linux ARM64 (M1 Mac Mini VM, self-hosted) ───────────────────────────────
  # needs: build-macos so the M1 Mac Mini host serializes its ARM64 jobs.
  build-linux-arm64:
    name: Linux (M1 Mac Mini VM, ARM64)
    runs-on: [self-hosted, Linux, ARM64]
    needs: build-macos
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B /tmp/retropp-engine-ci-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build /tmp/retropp-engine-ci-build --parallel

      - name: Test
        run: |
          set -o pipefail   # without this, tee's exit code masks ctest failures
          export SDL_VIDEODRIVER=offscreen   # headless: SDL video init succeeds so the GPU device (lavapipe) is reachable
          if [ "${{ github.event.inputs.capture_goldens }}" = "true" ]; then export RETROPP_CAPTURE_GOLDEN=1; fi
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir /tmp/retropp-engine-ci-build --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-arm64-test-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-test-results
          path: ci-output/

      - name: Upload captured goldens
        if: ${{ github.event.inputs.capture_goldens == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-linux-arm64
          path: tests/fixtures/golden/

  # ── Windows ARM64 (M1 Mac Mini VM, self-hosted) ─────────────────────────────
  # needs: build-linux-arm64 so the M1 Mac Mini host serializes its ARM64 jobs.
  build-windows-arm64:
    name: Windows clang-cl (M1 Mac Mini VM, ARM64)
    runs-on: [self-hosted, Windows, ARM64]
    needs: build-linux-arm64
    if: ${{ always() }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clean CMake cache (preserve downloads)
        shell: powershell
        run: |
          if (Test-Path C:\retropp-engine-ci-build\CMakeCache.txt) {
            Remove-Item C:\retropp-engine-ci-build\CMakeCache.txt -Force
          }
          if (Test-Path C:\retropp-engine-ci-build\CMakeFiles) {
            Remove-Item C:\retropp-engine-ci-build\CMakeFiles -Recurse -Force
          }
          if (Test-Path C:\retropp-engine-ci-build\_deps) {
            Get-ChildItem C:\retropp-engine-ci-build\_deps -Filter "*-subbuild" -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force
          }

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\retropp-engine-ci-build `
            -G "Visual Studio 17 2022" -A ARM64 -T ClangCL

      - name: Build
        shell: powershell
        run: cmake --build C:\retropp-engine-ci-build --config Release --parallel

      - name: Test
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\ci-output | Out-Null
          # Run-unique results name so a stale handle can never block the write (see windows-x64 above).
          Get-ChildItem C:\ci-output\windows-arm64-test-results*.txt -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
          if ("${{ github.event.inputs.capture_goldens }}" -eq "true") { $env:RETROPP_CAPTURE_GOLDEN = "1" }
          $results = "C:\ci-output\windows-arm64-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt"
          cmd /c "ctest --test-dir C:\retropp-engine-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # PowerShell pipefail equivalent — see windows-x64 Test step above.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-test-results
          path: C:\ci-output\windows-arm64-test-results-${{ github.run_id }}-${{ github.run_attempt }}.txt

      - name: Upload captured goldens
        if: ${{ github.event.inputs.capture_goldens == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-windows-arm64
          path: tests/fixtures/golden/
